# Default values for the GROOT Helm chart.
# See run/deploy/helm/groot/README.md and upstream SPECIFICATIONS.md.

image:
  repository: ghcr.io/hrodrig/groot
  # Empty → Chart.appVersion (vX.Y.Z). GHCR tags are v-prefixed; bare X.Y.Z is normalized.
  tag: ""
  pullPolicy: IfNotPresent
  # Private / air-gapped registry. Also copied onto the ServiceAccount unless
  # serviceAccount.imagePullSecrets is set (so groot-trigger Jobs inherit pull).
  # pullSecrets:
  #   - name: YOUR_PULL_SECRET
  pullSecrets: []

schedule: "0 */6 * * *"

# Extra container args after `collect --config /config/groot.yml`.
# Example: [--verbose] so post-collect upload OK lines appear in Job logs
# (logger.OK is verbose-gated in groot).
extraArgs: []

# Inject env from Secrets/ConfigMaps (e.g. AWS_* for upload.s3).
# Example:
#   extraEnvFrom:
#     - secretRef:
#         name: groot-s3
extraEnvFrom: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Empty → use image.pullSecrets. Set here only to override that list on the SA.
  imagePullSecrets: []

# Collect Job pod template (CronJob). groot-trigger Jobs do not use this map;
# they only inherit ServiceAccount imagePullSecrets.
# podAnnotations:
#   sidecar.istio.io/inject: "false"
podAnnotations: {}

# Distroless nonroot UID (matches ghcr.io/hrodrig/groot and groot-trigger Jobs).
podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

rbac:
  create: true

config:
  # Embedded groot.yml (see configs/groot.yml.sample). Override for your cluster.
  # For S3/GCS/SFTP: set upload.* here; put credentials in a Secret + extraEnvFrom.
  grootYml: |
    output_dir: /out
    file_prefix: groot-capture
    collection:
      timeout: 20m
      worker_concurrency: 4
      namespaces:
        - kube-system
        - default
      include_pod_logs: true
      include_node_details: true
      include_node_logs: false
      include_pod_metrics: true
    notify:
      on_failure:
        enabled: false
      retry:
        max_attempts: 3

persistence:
  enabled: true
  storageClass: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 1
# Forbid only applies to scheduled CronJob ticks. Manual
# `kubectl create job --from=cronjob/...` can still overlap — gate that yourself.
concurrencyPolicy: Forbid
startingDeadlineSeconds: 600
backoffLimit: 1

nodeSelector: {}
tolerations: []
affinity: {}
