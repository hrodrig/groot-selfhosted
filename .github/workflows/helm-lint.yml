# Validates the GROOT Helm chart on every PR / push to develop|main.
# Always report the `validate` job status so protect-develop required checks
# are not stuck when the PR only touches docs (path filters hid the check).
# helm lint: Chart.yaml, values, template syntax.
# kubeconform: rendered YAML vs Kubernetes OpenAPI schemas (no cluster required).
name: Helm chart

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.7.0
  KUBERNETES_VERSION: "1.30.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CHART_DIR: run/deploy/helm/groot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: helm lint
        run: helm lint "$CHART_DIR"

      - name: helm lint (pinned image tag)
        run: helm lint "$CHART_DIR" --set image.tag=v1.3.1

      - name: helm template + kubeconform (default values)
        run: |
          helm template test-rel "$CHART_DIR" --namespace groot | \
            kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -summary -

      - name: helm template + kubeconform (PVC disabled)
        run: |
          helm template test-rel "$CHART_DIR" --namespace groot \
            --set persistence.enabled=false | \
            kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -summary -

      - name: helm template + kubeconform (pull secrets + Istio annotation)
        run: |
          helm template test-rel "$CHART_DIR" --namespace groot \
            --set-json 'image.pullSecrets=[{"name":"regcred"}]' \
            --set-json 'podAnnotations={"sidecar.istio.io/inject":"false"}' | \
            kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -summary -
