# Validates the GROOT Helm chart on PRs and pushes that touch the chart.
# helm lint: Chart.yaml, values, template syntax.
# kubeconform: rendered YAML vs Kubernetes OpenAPI schemas (no cluster required).
name: Helm chart

on:
  pull_request:
    paths:
      - "run/deploy/helm/**"
      - ".github/workflows/helm-lint.yml"
  push:
    branches: [main, develop]
    paths:
      - "run/deploy/helm/**"
      - ".github/workflows/helm-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.7.0
  KUBERNETES_VERSION: "1.30.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CHART_DIR: run/deploy/helm/groot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: helm lint
        run: helm lint "$CHART_DIR"

      - name: helm lint (pinned image tag)
        run: helm lint "$CHART_DIR" --set image.tag=0.8.0

      - name: helm template + kubeconform (default values)
        run: |
          helm template test-rel "$CHART_DIR" --namespace groot | \
            kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -summary -

      - name: helm template + kubeconform (PVC disabled)
        run: |
          helm template test-rel "$CHART_DIR" --namespace groot \
            --set persistence.enabled=false | \
            kubeconform -strict -kubernetes-version "${KUBERNETES_VERSION}" -summary -
