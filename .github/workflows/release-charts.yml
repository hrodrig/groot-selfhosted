# Triggers Helm chart publish on the product repo (https://hrodrig.github.io/groot).
# Chart sources stay in this repo; gh-pages + index.yaml live on hrodrig/groot (see publish-helm-charts.yml there).
#
# Requires repository secret GROOT_PAGES_TOKEN: PAT with `repo` scope (or fine-grained
# contents write on hrodrig/groot) so repository_dispatch can reach the product repo.
name: Release Charts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Helm publish on hrodrig/groot
        env:
          GH_TOKEN: ${{ secrets.GROOT_PAGES_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Missing secret GROOT_PAGES_TOKEN (PAT with access to hrodrig/groot). See CONTRIBUTING.md."
            exit 1
          fi
          REF="${GITHUB_REF_NAME}"
          echo "Dispatching publish-helm-charts for ref ${REF}"
          gh api repos/hrodrig/groot/dispatches \
            -f event_type=publish-helm-charts \
            -f "client_payload[ref]=${REF}"
